<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Game Template</title>
  </head>
  <body>
    <div id="root"></div>
    <script nomodule>
      // Browsers without ES modules (Internet Explorer...) skip the game bundle entirely: explain it instead of a black screen
      var fr = /^fr/i.test(navigator.language || navigator.userLanguage || '');
      document.body.style.background = '#222';
      document.getElementById('root').innerHTML = '<p style="color:#fff;font-family:sans-serif;font-size:1.2em;padding:2em;text-align:center">'
        + (fr ? 'Votre navigateur est trop ancien pour afficher ce jeu. Utilisez une version récente de Chrome, Firefox, Edge ou Safari.'
          : 'Your browser is too old to display this game. Please use an up-to-date version of Chrome, Firefox, Edge or Safari.')
        + '</p>';
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
